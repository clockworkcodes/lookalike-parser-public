services:
  - type: web
    name: lookalike-parser
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
      - key: IG_SESSION_JSON
        sync: false
      - key: IG_PROXY
        sync: false
